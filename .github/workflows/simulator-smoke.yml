name: iPhone simulator smoke test
on:
  workflow_dispatch:
  push:
    branches:
      [codex/modernize-mobile-runtime, modernization/mobile-foundation-pr7]
    paths:
      - ".github/workflows/native-preview.yml"
      - "app.config.js"
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "local/**"
      - "src/**"
      - "scripts/native/**"
      - ".github/workflows/simulator-smoke.yml"
      - "scripts/smoke-ios.sh"
      - "scripts/check-ios-screen.swift"
      - "scripts/simulator.entitlements"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the latest native test build from this branch
        shell: bash
        run: |
          WP_RUN=""
          for WP_ATTEMPT in {1..20}; do
            WP_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-preview.yml/runs?branch=$GITHUB_REF_NAME&per_page=20" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA)) | .[0].id // empty')
            if [ -n "$WP_RUN" ]; then break; fi
            sleep 15
          done
          test -n "$WP_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WP_RUN" --jq '.head_sha')" = "$GITHUB_SHA"
          WP_STATUS=""
          for WP_ATTEMPT in {1..120}; do
            WP_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WP_RUN/jobs" --jq '.jobs[] | select(.name == "ios-simulator") | .conclusion')
            if [ "$WP_STATUS" = success ]; then break; fi
            if [ "$WP_STATUS" = failure ] || [ "$WP_STATUS" = cancelled ] || [ "$WP_STATUS" = timed_out ]; then exit 1; fi
            sleep 30
          done
          test "$WP_STATUS" = success
          gh run view "$WP_RUN" --json headSha,url > tested-build.json
          cat tested-build.json
          gh run download "$WP_RUN" -n Well-Ping-Local-iOS-Simulator -D preview
          mkdir -p build/ios/Build/Products/Release-iphonesimulator
          unzip -q preview/Well-Ping-Local-Simulator.zip -d build/ios/Build/Products/Release-iphonesimulator
      - name: Launch and reopen in iPhone simulator
        run: bash scripts/smoke-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-test-evidence
          path: |
            tested-build.json
            ios-first-launch.png
            ios-reopen.png
            simulator-processes.txt
            simulator-launch.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Well-Ping-Local-Tested-iOS-Simulator
          path: Well-Ping-Local-Tested-Simulator.zip
          if-no-files-found: error
          retention-days: 14
