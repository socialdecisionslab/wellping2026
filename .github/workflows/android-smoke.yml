name: Android emulator smoke test
on:
  workflow_call:
    inputs:
      reviewed-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  launch-and-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVIEWED_SHA: ${{ inputs.reviewed-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.reviewed-sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Well-Ping-Local-Android
          path: preview
      - name: Verify same-run artifact and exact source
        run: bash scripts/native/build-identity.sh verify preview
      - name: Grant runner-only emulator acceleration access
        run: |
          if test -c /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
      - name: Verify existing emulator acceleration access
        run: |
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            printf '%s\n' '{"status":"blocked","category":"infrastructure","reason":"kvm-unavailable"}' > android-result.json
            echo '::error::Infrastructure blocker: /dev/kvm is not readable/writable; app was not launched.'
            echo 'Android runtime unverified: emulator acceleration unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-test-evidence
          path: |
            preview/tested-build.json
            android-*.xml
            android-reopened.png
            android-result.json
          retention-days: 14
