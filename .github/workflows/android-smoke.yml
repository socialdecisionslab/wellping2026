name: Android emulator smoke test
on:
  workflow_run:
    workflows: ["Native test builds"]
    types: [completed]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Successful native build run for the exact selected commit"
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  launch-and-resume:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Download verified native build for this exact commit
        env:
          WP_RUN: ${{ github.event.workflow_run.id || inputs.native_run_id }}
          WP_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh run view "$WP_RUN" --json headSha,conclusion,url,workflowName > tested-build.json
          jq -e --arg sha "$WP_EXPECTED_SHA" '.headSha == $sha and .conclusion == "success" and .workflowName == "Native test builds"' tested-build.json
          gh run download "$WP_RUN" -n Well-Ping-Local-Android -D preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-test-evidence
          path: |
            tested-build.json
            android-*.xml
            android-reopened.png
            android-result.json
          retention-days: 14
