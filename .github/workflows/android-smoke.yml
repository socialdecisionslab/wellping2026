name: Android emulator smoke test
on:
  workflow_dispatch:
  push:
    branches:
      [codex/modernize-mobile-runtime, modernization/mobile-foundation-pr7]
    paths:
      - "App.tsx"
      - "index.js"
      - "config/**"
      - "babel.config.js"
      - "metro.config.js"
      - "tsconfig.json"
      - ".nvmrc"
      - ".yarnrc.yml"
      - "vendor/**"
      - "scripts/babel-strip-console.cjs"
      - ".github/workflows/native-preview.yml"
      - "app.config.js"
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "local/**"
      - "src/**"
      - "scripts/native/**"
      - ".github/workflows/android-smoke.yml"
      - "scripts/smoke-android.py"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  launch-and-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download latest native test build from this branch
        run: |
          WP_RUN=""
          for WP_ATTEMPT in {1..20}; do
            WP_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-preview.yml/runs?branch=$GITHUB_REF_NAME&per_page=20" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA)) | .[0].id // empty')
            if [ -n "$WP_RUN" ]; then break; fi
            sleep 15
          done
          test -n "$WP_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WP_RUN" --jq '.head_sha')" = "$GITHUB_SHA"
          WP_STATUS=""
          for WP_ATTEMPT in {1..120}; do
            WP_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WP_RUN/jobs" --jq '.jobs[] | select(.name == "android") | .conclusion')
            if [ "$WP_STATUS" = success ]; then break; fi
            if [ "$WP_STATUS" = failure ] || [ "$WP_STATUS" = cancelled ] || [ "$WP_STATUS" = timed_out ]; then exit 1; fi
            sleep 30
          done
          test "$WP_STATUS" = success
          gh run view "$WP_RUN" --json headSha,url > tested-build.json
          cat tested-build.json
          gh run download "$WP_RUN" -n Well-Ping-Local-Android -D preview
      - name: Verify existing emulator acceleration access
        run: test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-test-evidence
          path: |
            tested-build.json
            android-*.xml
            android-reopened.png
            android-result.json
          retention-days: 14
