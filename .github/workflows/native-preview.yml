name: Native test builds
on:
  workflow_dispatch:
  push:
    branches: [codex/modernize-mobile-runtime]
    paths:
      - ".github/workflows/native-preview.yml"
      - "scripts/native/**"
      - "scripts/simulator.entitlements"
      - "config/**"
      - "App.tsx"
      - "index.js"
      - "metro.config.js"
      - "babel.config.js"
      - "vendor/**"
      - "app.config.js"
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "local/**"
      - "src/**"
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  WELLPING_LOCAL_ONLY: "1"
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: corepack yarn install --immutable
      - name: Generate isolated Android project
        run: corepack yarn expo prebuild --platform android --no-install
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g" -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Check package and signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > android-badging.txt
          head -5 android-badging.txt
          grep -F "package: name='app.wellping.local'" android-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Well-Ping-Local-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack yarn install --immutable
      - name: Generate isolated iOS project
        run: corepack yarn expo prebuild --platform ios --no-install
      - name: Configure simulator keychain identity
        run: cp scripts/simulator.entitlements ios/WellPingLocal/WellPingLocal.entitlements
      - name: Install native dependencies
        working-directory: ios
        run: pod install
      - name: Build standalone simulator app
        run: |
          xcodebuild -workspace ios/WellPingLocal.xcworkspace -scheme WellPingLocal -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > ios-build.log 2>&1 || { tail -100 ios-build.log; exit 1; }
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/WellPingLocal.app Well-Ping-Local-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Well-Ping-Local-iOS-Simulator
          path: Well-Ping-Local-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-log
          path: ios-build.log
          retention-days: 7
