name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check toolchain
        run: node scripts/check-environment.cjs
      - name: Install exact dependencies
        run: node .yarn/releases/yarn-3.1.1.cjs install --immutable
      - name: Type-check and test with synthetic data
        run: node .yarn/releases/yarn-3.1.1.cjs test:ci
      - name: Compile isolated iOS and Android bundles
        run: node .yarn/releases/yarn-3.1.1.cjs smoke:local
