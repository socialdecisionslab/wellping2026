name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check toolchain
        run: node scripts/check-environment.cjs
      - name: Install exact dependencies
        run: corepack yarn install --immutable
      - name: Type-check and test with synthetic data
        run: corepack yarn test:ci
      - name: Compile isolated iOS and Android bundles
        run: corepack yarn smoke:local
      - name: Compile participant iOS and Android bundles with synthetic staging config
        run: corepack yarn smoke:release
