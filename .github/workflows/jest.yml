name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Check toolchain
        run: node scripts/check-environment.cjs
      - name: Install exact dependencies
        run: corepack yarn install --immutable
      - name: Verify clean source provenance (not release approval)
        run: node scripts/release-manifest.cjs
      - name: Check exact-commit native workflow triggers
        run: node scripts/check-native-workflows.cjs
      - name: Test native smoke readiness handling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Lint source correctness
        run: corepack yarn lint
      - name: Type-check and test with synthetic data
        run: corepack yarn test:ci
      - name: Test local researcher workbench with synthetic data
        run: corepack yarn test:researcher
      - name: Compile isolated iOS and Android bundles
        run: corepack yarn smoke:local
      - name: Compile participant iOS and Android bundles with synthetic staging config
        run: corepack yarn smoke:release
      - name: Compile production participant UI without launching or backend access
        run: node scripts/check-production-bundles.cjs
