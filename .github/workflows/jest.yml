name: Validation
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-3.1.1.cjs install --immutable
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Unit and integration tests
        run: node node_modules/jest/bin/jest.js --runInBand --watch=false --coverage=false
      - name: Security regression checks
        run: |
          node tests/security/secure-resume.cjs
          node scripts/security/check-network-boundaries.cjs
          node scripts/test-security-diagnostics.cjs
